# clipperyt config — easiest to edit in the dashboard (Settings tab).
# [stream] holds the defaults for `clipper.py watch` and the new-job form;
# dashboard jobs bring their own channels.

[stream]
# Fill in every platform the streamer is live on. Chat from ALL of them is
# combined for spike detection; video is recorded from `record_from` only.
# Leave a platform as "" if they don't stream there.
record_from = "youtube"     # "youtube", "twitch" or "kick"

[stream.channels]
youtube = "CHANNEL_HANDLE"  # youtube.com/@<handle>  (without @)
twitch  = ""                # twitch.tv/<login>
kick    = ""                # kick.com/<slug>

[stream.options]
# Recorder: "auto" = YouTube → yt-dlp (works with cookies when YouTube bot-checks),
# Twitch/Kick → streamlink (skips Twitch ads). Or force "streamlink" / "yt-dlp".
recorder = "auto"
quality = "best"
# Seconds between "is it live yet?" checks while waiting
retry_seconds = 30
# Twitch only: skip the ad segments Twitch stitches into the stream (the ad isn't
# recorded; the stream underneath it is lost either way for logged-out viewers)
twitch_disable_ads = true
# Twitch only, optional: OAuth token of an account with Turbo or a sub to this
# channel → no ads at all, nothing lost. (twitch.tv → DevTools → Cookies → auth-token)
twitch_oauth_token = ""
# YouTube "confirm you're not a bot"? Export cookies.txt from a browser logged in to YouTube
# (a spare account is best) and put its path here. Used by yt-dlp and streamlink.
youtube_cookies = ""
# …or let yt-dlp read them from a browser on this Mac: "chrome", "firefox", "safari", "brave", "edge"
cookies_from_browser = ""
# Kick only: set this if the chatroom id lookup gets blocked (see README)
# kick_chatroom_id = 123456

[spikes]
bucket_seconds = 10         # chat is counted in 10 s buckets
baseline_seconds = 300      # compared against the previous 5 minutes
multiplier = 3.0            # spike = bucket >= 3x baseline average
min_messages = 8            # ignore "spikes" in a dead chat (2 msgs vs 0.5 avg)
warmup_seconds = 120        # skip the first 2 minutes (chat flood when stream starts)
merge_seconds = 60          # spikes closer than this become one clip
# Short hype messages get extra weight (case-insensitive, matched as whole message or word)
hype_words = ["omg", "lol", "lmao", "gg", "w", "l", "bhai", "op", "kya", "bc", "wtf", "clip", "clip it", "😂", "🤣", "💀", "🔥", "pog", "hahaha",
              # Twitch emotes arrive as words
              "kekw", "lul", "omegalul", "pogchamp", "poggers", "monkas", "pepelaugh", "kappa", "lulw", "sadge", "ez", "clap"]
hype_weight = 0.5           # each hype message counts as 1.5 instead of 1
# Clip requests: >= clip_min_users different chatters saying a clip phrase within
# clip_window_seconds is a moment too (even without a spike). Whole words, any case.
clip_requests = true
clip_phrases = ["clip", "clip it", "clip that", "clip this", "clipped", "clip karo", "clip kro", "clip kar do", "!clip"]
clip_min_users = 3
clip_window_seconds = 20
clip_boost = 1.0            # score added per requesting chatter (also boosts an overlapping spike)

[clip]
stream_delay_seconds = 8    # viewers see the stream ~8 s late, so chat reacts late
lead_seconds = 30           # start clip this long before the (delay-corrected) spike
length_seconds = 45
max_clips = 25              # keep only the top N per stream (per hour while clipping live)
# Long streams (some run 24 h+): clip what's recorded so far every N minutes while
# recording continues; at the end only the rest is clipped. 0 = clip only at the end.
process_every_minutes = 60

[captions]
enabled = true
whisper_bin = "whisper-cli"
model = "models/ggml-large-v3-turbo-q5_0.bin"
language = "auto"           # "auto" detects per clip (Hindi or English) · or force "hi" / "en"
translate = false           # true = English captions (needs a non-turbo model, e.g. ggml-medium.bin)

[render]
# Output shape:
#   "9:16-blur"  1080x1920, the whole 16:9 frame across the middle, blurred copy fills top/bottom
#   "9:16-bars"  1080x1920, the whole 16:9 frame across the middle, black top/bottom
#   "16:9"       1920x1080, original shape
#   "9:16-crop"  1080x1920, centre crop (cuts off the sides)
format = "9:16-blur"
# "auto" = Mac hardware (videotoolbox) → NVIDIA GPU (nvenc) → CPU (libx264)
encoder = "auto"
font_size = 64               # caption size in px on a 1080-wide frame
font = "auto"               # auto = Kohinoor Devanagari (Mac) / Noto Sans Devanagari (Linux)
credit = true               # small "@channel on YouTube/Kick" credit burned in at the top

[storage]
# Where new recordings + clips go. "" = sessions/ next to the app.
# Another drive: "/Volumes/BigDrive/clipperyt" (Mac) or "/mnt/media/clipperyt" (Linux).
# The folder above it must exist (so an unplugged drive never fills the internal disk).
sessions_dir = ""
# Older recordings folders whose sessions are still listed (filled in when you change sessions_dir)
also_scan = []
# After a reboot the drive may mount after the dashboard starts: autostart and One-link jobs
# wait up to this long for the recordings folder (watch jobs keep retrying after that anyway)
wait_for_drive_seconds = 300

[titles]
# "Titles" on a clip asks an AI model (through OpenRouter) for YouTube Shorts titles — only when
# you press it; recording and clipping never call it. Key from openrouter.ai/keys.
openrouter_api_key = ""
model = "x-ai/grok-4.7"     # any OpenRouter model id
language = "hinglish"       # "hinglish", "english" or "hindi"
style = ""                  # optional notes, e.g. "mention GTA RP"

[youtube]
# Post clips as Shorts with one click, or schedule them into time slots. One-time setup:
# Settings → YouTube in the dashboard walks through it (Google Cloud OAuth client of type
# "TVs and Limited Input devices"). Only used when you press Post or Schedule.
client_id = ""
client_secret = ""
privacy = "public"          # for "Post now": public, unlisted or private
slots_per_day = 4           # scheduled posts per day
slot_gap_hours = 3.0
window_start = "10:00"
window_end = "22:00"
timezone = "Asia/Kolkata"
category_id = "20"          # Gaming
made_for_kids = false

[limits]
# How many streams can be cut + transcribed + rendered at the same time.
# Recording is never limited; clipping waits for a free slot. 1 is safest for whisper.
max_parallel_processing = 1
